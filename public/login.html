<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORCAP — Login</title>
<style>
  :root {
    --bg: #0a0d12; --surface: #0e1117; --surface2: #141920;
    --border: #1e2530; --border-light: #2a3444;
    --amber: #f5a623; --amber-glow: rgba(245,166,35,0.08);
    --red: #e05252; --green: #3db87a; --text: #c8d4e8;
    --text-bright: #eef2fa; --text-dim: #5a6a82;
    --mono: 'Courier New', monospace;
    --cond: 'Arial Narrow', 'Barlow Condensed', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .login-wrap {
    width: 100%;
    max-width: 420px;
    padding: 20px;
  }
  .logo {
    text-align: center;
    margin-bottom: 40px;
  }
  .logo-mark {
    font-size: 36px;
    font-weight: 900;
    color: var(--amber);
    letter-spacing: 2px;
    font-family: var(--cond);
  }
  .logo-main {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 6px;
    color: var(--text-bright);
    font-family: var(--cond);
    margin-top: 4px;
  }
  .logo-tag {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-top: 4px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 32px;
  }
  .card-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 24px;
  }
  .fg { margin-bottom: 16px; }
  label {
    display: block;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg);
    border: 1px solid var(--border-light);
    border-radius: 4px;
    color: var(--text-bright);
    font-size: 14px;
    outline: none;
    transition: all 0.15s;
    font-family: inherit;
  }
  input:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,166,35,0.1); }
  .btn {
    width: 100%;
    padding: 12px;
    background: var(--amber);
    color: #000;
    border: none;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.15s;
  }
  .btn:hover { background: #f8b733; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    background: rgba(224,82,82,0.1);
    border: 1px solid rgba(224,82,82,0.3);
    border-radius: 4px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--red);
    margin-bottom: 16px;
    display: none;
  }
  .footer-note {
    text-align: center;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 24px;
  }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="logo">
    <div class="logo-mark">M∆</div>
    <div class="logo-main">FORCAP</div>
    <div class="logo-tag">MARITIME INCIDENT DECISION ENGINE</div>
  </div>

  <div class="card">
    <div class="card-title">// SIGN IN</div>
    <div class="error" id="errorBox"></div>
    <div class="fg">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="officer@company.com" onkeydown="if(event.key==='Enter')login()">
    </div>
    <div class="fg">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button class="btn" id="loginBtn" onclick="login()">SIGN IN →</button>
  </div>

  <div class="footer-note">Contact your administrator to request access</div>
</div>

<script>
async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errorBox');

  if (!email || !password) { showError('Please enter email and password'); return; }

  btn.disabled = true;
  btn.textContent = 'SIGNING IN…';
  err.style.display = 'none';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) { showError(data.error || 'Login failed'); return; }

    localStorage.setItem('maride_token', data.token);
    localStorage.setItem('maride_user', JSON.stringify(data.user));
    window.location.href = '/';
  } catch(e) {
    showError('Connection error — please try again');
  } finally {
    btn.disabled = false;
    btn.textContent = 'SIGN IN →';
  }
}

function showError(msg) {
  const err = document.getElementById('errorBox');
  err.textContent = msg;
  err.style.display = 'block';
}

// Check if already logged in with a valid token
async function checkExistingSession() {
  const token = localStorage.getItem('maride_token');
  if (!token) return;
  try {
    const res = await fetch('/api/auth/me', { headers: { 'x-auth-token': token } });
    if (res.ok) {
      window.location.href = '/';
    } else {
      // Token invalid — clear it
      localStorage.removeItem('maride_token');
      localStorage.removeItem('maride_user');
    }
  } catch(e) {
    // Network error — don't redirect
  }
}
checkExistingSession();
</script>
</body>
</html>
